{% extends 'base.html' %}

{% block title %}Login - Farmer AI{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 3rem auto;">
    <div class="card">
        <h2 style="color: var(--primary-dark); text-align: center; margin-bottom: 1.5rem;">
            👤 Farmer Login
        </h2>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="ramesh@farmer.ai" required value="ramesh@farmer.ai">
            </div>

            <div class="form-group">
                <div class="form-header-flex">
                    <label for="password">Password</label>
                    <a href="{{ url_for('forgot_password') }}" class="forgot-link" data-i18n="forgotPassword">Forgot Password?</a>
                </div>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required value="password123">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
                Login ➔
            </button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary);">
            Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary-color); font-weight: 600;">Register here</a>
        </p>

        <div style="background: #f1f8e9; border: 1px dashed var(--primary-light); padding: 1rem; border-radius: 8px; margin-top: 1.5rem; font-size: 0.9rem;">
            <strong>🔑 Quick Demo Credentials:</strong><br>
            Email: <code>ramesh@farmer.ai</code><br>
            Password: <code>password123</code>
        </div>
    </div>
</div>
{% endblock %}
