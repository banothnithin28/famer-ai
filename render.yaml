services:
  - type: web
    name: farmer-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && npm ci && npm run build
    startCommand: python database/init_db.py && gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 app:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /var/data/farmer.db
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: FLASK_DEBUG
        value: "False"
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
    disk:
      name: farmer-ai-data
      mountPath: /var/data
      sizeGB: 1